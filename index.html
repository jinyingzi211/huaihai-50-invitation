<text x="82" y="1423" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">海同心、同向、同行，共同走过半世纪的发</text>
<text x="82" y="1475" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">展征程。五十年沐雨栉风，淮海人从彭城两</text>
<text x="82" y="1527" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">山口一间村办作坊起步，以“厚德敬业、创</text>
<text x="82" y="1579" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">新进取、敢为善为、大有作为”的企业精神，</text>
<text x="82" y="1631" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">砥砺奋进，成就今日之辉煌。如今，淮海已</text>
<text x="82" y="1683" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">连续多年荣膺中国民营企业500强、中国制</text>
<text x="82" y="1735" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">造业500强，成为全球微车及核心配件领域</text>
<text x="82" y="1787" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">的链主企业。</text>
<text x="82" y="1869" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">　　2026年，恰逢淮海控股集团成立五十</text>
<text x="82" y="1921" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">周年华诞，也是集团“十五五”战略规划的</text>
<text x="82" y="1973" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">开局之年，更是全面落地“五化战略”、锚</text>
<text x="82" y="2025" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">定“世界名车、百年淮海”宏伟愿景的关键</text>
<text x="82" y="2077" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">里程碑。值此承前启后的历史性时刻，我们</text>
<text x="82" y="2129" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">定于2026年11月16日至17日，在徐州绿地</text>

<text x="82" y="2233" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">年”——淮海控股集团50周年庆典暨2027</text>
<text x="82" y="2285" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">年全球供销大会。</text>
<text x="82" y="2367" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">　　届时，庆典大会将深情回望五秩峥嵘岁</text>
<text x="82" y="2419" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">月，向一路同行的功勋伙伴致以崇高敬意；</text>
<text x="82" y="2471" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">全球供销大会将重磅发布集团“十五五”战</text>
<text x="82" y="2523" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">略蓝图，擘画新能源、数智化等领域的前瞻</text>
<text x="82" y="2575" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">布局，与全球合作伙伴共谋发展、共赢未来，</text>
<text x="82" y="2627" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">携手开启新百年征程。</text>
<text x="82" y="2709" font-family="Microsoft YaHei" font-size="30" fill="#593023" text-anchor="start" letter-spacing="0.15" font-weight="normal">　　我们诚意期盼您拨冗亲临，共叙情谊，</text>
